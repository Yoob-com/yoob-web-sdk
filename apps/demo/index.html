<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yoob Web Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="stage">
      <div id="character" class="character"></div>
      <section class="captions" aria-live="polite">
        <p id="assistant-caption" class="assistant"></p>
        <p id="user-caption" class="user"></p>
      </section>
      <section class="panel">
        <p id="status" aria-live="polite">Checking this browser…</p>
        <progress id="progress" max="1" value="0" hidden></progress>
        <div class="row">
          <button id="talk" type="button" disabled>Talk</button>
          <button id="mute" type="button" class="icon" aria-pressed="false" aria-label="Mute microphone" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
          </button>
          <div class="meter" role="meter" aria-label="Microphone level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="meter-bar"></span>
          </div>
        </div>
        <div class="row">
          <label for="character-picker">Character</label>
          <select id="character-picker"></select>
        </div>
        <div class="row">
          <label for="microphone">Microphone</label>
          <select id="microphone"><option value="">System default</option></select>
          <button id="speak" type="button" class="secondary" disabled>Play sample</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
